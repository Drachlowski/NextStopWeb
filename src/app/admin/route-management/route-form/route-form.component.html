<div class="route-form-container">
  <h2>{{ isEditMode ? 'Edit Route' : 'Add Route' }}</h2>

  <form (ngSubmit)="save()" #routeForm="ngForm">
    <mat-form-field class="full-width">
      <mat-label>Route Name</mat-label>
      <input matInput name="routeName" [(ngModel)]="routeData.routeName" required />
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Validity Start Date</mat-label>
      <input
        matInput
        [matDatepicker]="datePicker"
        name="validityStartDate"
        [(ngModel)]="routeData.validityStartDate"
        required />
        <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
        <mat-datepicker #datePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Validity End Date</mat-label>
      <input
        matInput
        [matDatepicker]="endDatePicker"
        name="validityEndDate"
        [(ngModel)]="routeData.validityEndDate" />
      <mat-datepicker-toggle matSuffix [for]="endDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #endDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Days of Operation</mat-label>
      <input matInput name="daysOfOperation" [(ngModel)]="routeData.daysOfOperation" />
    </mat-form-field>

    <div class="route-stops-section">
      <h3>Route Stops</h3>

      <app-route-stops [routeIdInput]="routeData.id!" [isEditMode]="isEditMode"></app-route-stops>
    </div>

    <div class="actions">
      <button mat-raised-button color="primary" type="submit" [disabled]="routeForm.invalid">
        Save
      </button>
      <button mat-button color="warn" type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
